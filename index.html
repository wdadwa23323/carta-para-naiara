
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi Miniña ❤️</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg,#ffe1ed,#ead5ff,#fbd5e8);
    font-family: Georgia,serif;
    color: #633477;
    overflow-x: hidden;
}

.heart {
    position: fixed;
    bottom: -30px;
    color: #d77eb5;
    animation: float 9s linear infinite;
    pointer-events: none;
    z-index: 0;
}

@keyframes float {
    to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}

.screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px 15px;
    position: relative;
    z-index: 1;
}

h1 {
    text-align: center;
    color: #873c83;
    font-size: clamp(28px,7vw,42px);
}

.subtitle {
    text-align: center;
    color: #a45b9e;
    font-style: italic;
    margin-bottom: 35px;
}

.envelope {
    width: min(340px,85vw);
    height: 220px;
    position: relative;
    background: #ed9fc5;
    border: 3px solid #a66bb6;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 15px 35px #9d579a44;
    transition: transform .3s;
}

.envelope:hover { transform: scale(1.03); }

.flap {
    position: absolute;
    inset: 0;
    background: #f7b9d7;
    clip-path: polygon(0 0,100% 0,50% 75%);
    transform-origin: top;
    transition: transform 1.8s ease;
    z-index: 3;
}

.seal {
    position: absolute;
    top: 85px;
    left: 50%;
    transform: translateX(-50%);
    background: #a04489;
    color: white;
    border-radius: 50%;
    width: 65px;
    height: 65px;
    display: grid;
    place-items: center;
    font-size: 35px;
    z-index: 4;
    transition: opacity .5s;
}

.opening .flap { transform: rotateX(180deg); }
.opening .seal { opacity: 0; }

.envelope-text {
    text-align: center;
    margin-top: 32px;
    font-weight: bold;
    font-size: 21px;
}

button {
    border: 0;
    background: linear-gradient(120deg,#d875a8,#9560b9);
    color: white;
    padding: 14px 27px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 5px 15px #8b4c9c44;
}

button:disabled { opacity: .6; }

#letter {
    display: none;
    width: min(850px,95%);
    margin: 25px auto;
    padding: 25px 18px;
    background: #fff7fc;
    border: 4px solid #c38bc9;
    border-radius: 18px;
    box-shadow: 0 12px 40px #864c9a33;
    position: relative;
    z-index: 2;
}

.letter-title {
    text-align: center;
    color: #a34b91;
    font-size: 28px;
}

.letter-content {
    display: grid;
    grid-template-columns: 35px minmax(0,1fr) 35px;
    gap: 5px;
}

.side-hearts {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;
    color: #d66da7;
    font-size: 20px;
    overflow: hidden;
}

#message {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 16px;
    line-height: 1.9;
    color: #443047;
    min-height: 100px;
}

.final {
    text-align: center;
    color: #a04489;
    font-weight: bold;
    font-size: 24px;
    padding: 25px 0;
}

#letter.open {
    animation: appear 1.5s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(35px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@media(max-width:450px) {
    #letter { padding: 18px 8px; }
    .letter-content { grid-template-columns: 22px minmax(0,1fr) 22px; gap: 3px; }
    .side-hearts { font-size: 14px; }
    #message { font-size: 15px; line-height: 1.85; }
}
</style>
</head>

<body>

<div class="screen" id="cover">
    <h1>Para mi Miniña ❤️</h1>
    <div class="subtitle">SIEMPRE VAS A SER TÚ NAIARA</div>

    <div class="envelope" id="envelope" onclick="openLetter()">
        <div class="flap"></div>
        <div class="seal">♥</div>
    </div>

    <div class="envelope-text">ÁBRELO, MINIÑA 💗</div>
    <p>He preparado algo solo para ti.</p>
</div>

<section id="letter">
    <h2 class="letter-title">♥ Para mi Miniña ♥</h2>
    <p style="text-align:center;color:#a56cc1;font-style:italic">
        1 año y 9 meses de nuestra historia
    </p>

    <div class="letter-content">
        <div class="side-hearts" id="leftHearts"></div>
        <div>
            <div id="message"></div>
            <div class="final" id="final"></div>
        </div>
        <div class="side-hearts" id="rightHearts"></div>
    </div>
</section>

<script>
const message = `Bueno miniña feliz ya que estoy 1 año y 9 meses atrasados se me olvido ami  y a ti asique no me pegues tampoco

quiero decirte lo mucho que te amo y lo mucho que me importas eres lo mejor que me a llegado a mi vida y siempre voy a tener en mi vida te amo a morir no me gusta que estes insegura con lo que me a costado ponerte feliz y segura me duele mucho verte mal y triste eres lo mejor mejor que tengo y siempre te lo digo me da igual repetirtelo una y otra vez ya 1 año y 9 meses lo nuestro ya es para siempre almenos de mi parte porque eres lo mas bonito que tengo en este mundo  y decirte que me quiero casar contigo tener minimo y maximo 2-3 hijos y  tener una familia contigo y ser los mas felices del mundo vivir solos y tener juguetes bonitos pero no de niños para que juegue mami y papi jajaja sueño cada dia con tener una vida junto a ti viajar junto como tu me dices mucho gracias por estar conmigo en mi vida y pasando de esto te quiero hacer unas preguntas para terminar aqui que sepas que te amo con todo mi corazon

PREGUNTAS

1. te quieres casar conmigo?:

2. cuantos hijos quieres tener conmigo y a que edad:

3. donde te gustaria tener nuestro primer viaje:

4. y porque te gustaria ir hay "SINCERA"

5. abierta o sin abrir las prnas? jajaj:

dejando esto gordita vuelvo y te repito no te pongas triste no te agobies no llores siempre voy a tener ojos para ti y siempre voy a ser tuyo no me hace falta ver nada teniendo 1000 y pico en donde ya sabes TE AMO GUAPA y por si no te queda claro

` + "\n" + Array(50).fill("te amo").join("\n");

let index = 0;
let started = false;
let timer;

function openLetter() {
    if (started) return;
    started = true;

    const envelope = document.getElementById("envelope");
    envelope.classList.add("opening");

    setTimeout(() => {
        document.getElementById("cover").style.display = "none";
        const letter = document.getElementById("letter");
        letter.style.display = "block";
        letter.classList.add("open");

        for (let i=0;i<22;i++) {
            for (const id of ["leftHearts","rightHearts"]) {
                const heart = document.createElement("span");
                heart.textContent = i%2 ? "♡" : "♥";
                document.getElementById(id).appendChild(heart);
            }
        }

        typeText();
    }, 2300);
}

function typeText() {
    if (index < message.length) {
        const amount = Math.min(index + 3,message.length);
        document.getElementById("message").textContent =
            message.slice(0,amount);
        index = amount;
        window.scrollTo(0,document.body.scrollHeight);
        timer = setTimeout(typeText,75);
    } else {
        document.getElementById("final").textContent =
            "ERES EL AMOR DE MI VIDA ❤️";
    }
}

function floatingHearts() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = Math.random() > .5 ? "♥" : "♡";
    heart.style.left = Math.random()*100+"vw";
    heart.style.fontSize = (12+Math.random()*20)+"px";
    heart.style.animationDuration = (7+Math.random()*6)+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),13000);
}

setInterval(floatingHearts,500);
</script>

</body>
</html>
